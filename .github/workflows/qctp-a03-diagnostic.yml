name: QCTP A03 diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/qctp-a03-diagnostic-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-a03:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PR candidate merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install A03 render dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check numpy scipy soundfile librosa torch torchaudio chatterbox-tts

      - name: Record environment
        run: |
          mkdir -p QCTP_A03_DIAGNOSTIC
          {
            echo "commit=${GITHUB_SHA}"
            python --version
            pip --version
            ffmpeg -version | head -n 3
            ffprobe -version | head -n 2
            free -h
            df -h
            python - <<'PY'
          import torch
          print('torch', torch.__version__)
          print('cuda', torch.cuda.is_available())
          PY
          } > QCTP_A03_DIAGNOSTIC/environment.log 2>&1

      - name: Run A03 builder with persistent diagnostics
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p QCTP_A03_DIAGNOSTIC QCTP_A03_AUDIO_PACKAGE
          python tools/build_qctp_a03_audio.py \
            --repo . \
            --reference public/audio/day1/cue-0000.mp3 \
            --out QCTP_A03_AUDIO_PACKAGE \
            > QCTP_A03_DIAGNOSTIC/build.log 2>&1
          status=$?
          set -e
          python - "$status" <<'PY'
          import json, pathlib, sys
          status=int(sys.argv[1])
          log=pathlib.Path('QCTP_A03_DIAGNOSTIC/build.log')
          lines=log.read_text(errors='replace').splitlines() if log.exists() else []
          files=[]
          root=pathlib.Path('QCTP_A03_AUDIO_PACKAGE')
          if root.exists():
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      files.append({'path':str(p),'bytes':p.stat().st_size})
          record={
              'schema':'qctp-a03-diagnostic-v1',
              'result':'PASS' if status==0 else 'FAIL',
              'exit_code':status,
              'github_sha':'${{ github.sha }}',
              'tail':lines[-250:],
              'partial_files':files,
          }
          pathlib.Path('QCTP_A03_DIAGNOSTIC/result.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          echo "A03 builder exit code: $status"
          tail -n 250 QCTP_A03_DIAGNOSTIC/build.log || true
          exit "$status"

      - name: Upload A03 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qctp-a03-diagnostic-${{ github.sha }}
          path: |
            QCTP_A03_DIAGNOSTIC/
            QCTP_A03_AUDIO_PACKAGE/
          if-no-files-found: warn
          retention-days: 30
