name: QCTP candidate verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "server/**"
      - "local-whisper-companion/**"
      - "tests/**"
      - "tools/**"
      - "public/audio/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/qctp-pr-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qctp-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify QCTP candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Materialize or verify the local Day 1 audio pack
        run: node tools/cache-day1-audio.mjs

      - name: Export generated Day 1 audio pack
        uses: actions/upload-artifact@v4
        with:
          name: qctp-day1-local-audio-${{ github.event.pull_request.head.sha || github.sha }}
          path: public/audio/day1/
          if-no-files-found: error
          retention-days: 14

      - name: Persist the checksum-verified local audio pack
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/day1
          if git diff --cached --quiet; then
            echo "The local Day 1 audio pack is already committed."
          else
            git commit -m "Package Day 1 narration as verified local audio"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Normalize candidate formatting for the verification workspace
        run: npm run format

      - name: Run formatting, lint, types, coverage, and production build
        run: npm run check

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser acceptance suite
        run: npm run test:e2e

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install local Whisper companion dependencies
        working-directory: local-whisper-companion
        run: uv sync --extra dev

      - name: Run local Whisper tests and quality gates
        working-directory: local-whisper-companion
        run: |
          uv run pytest --cov --cov-report=term-missing
          uv run ruff check .
          uv run basedpyright
          uv run ty check

      - name: Upload verified PWA distribution
        uses: actions/upload-artifact@v4
        with:
          name: qctp-candidate-dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
