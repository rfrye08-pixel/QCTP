name: Deploy QCTP device preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/qctp-device-preview-deploy.yml"
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/qctp-device-preview-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qctp-device-preview-deploy
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Verify candidate and publish isolated preview
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'qctp-device-preview-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CANDIDATE_SHA: ecb2aa6cbed879fbd6313a1ebc1c9adc417adf00
      PREVIEW_PATH: device-preview

    steps:
      - name: Check out pinned Rev2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install exact dependencies
        working-directory: candidate
        run: npm ci

      - name: Run formatting, lint, type, unit, coverage, and production-build gates
        working-directory: candidate
        run: npm run check

      - name: Install Playwright Chromium
        working-directory: candidate
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance suite
        working-directory: candidate
        run: npm run test:e2e

      - name: Check out the released Pages branch without replacing the root app
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Stage the verified build in an isolated Pages subdirectory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "site/${PREVIEW_PATH}"
          mkdir -p "site/${PREVIEW_PATH}"
          cp -a candidate/dist/. "site/${PREVIEW_PATH}/"
          cat > "site/${PREVIEW_PATH}/QCTP_DEVICE_PREVIEW_DEPLOYMENT.json" <<EOF
          {
            "schema": "qctp-device-preview-deployment-v1",
            "candidate_sha": "${CANDIDATE_SHA}",
            "source_branch": "qctp-platform-rev2-codex",
            "deployment_scope": "PHYSICAL_IPHONE_AUDIO_ACCEPTANCE_ONLY",
            "production_release": false,
            "workflow_run": "${GITHUB_RUN_ID}"
          }
          EOF

      - name: Publish the isolated preview to GitHub Pages source
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PREVIEW_PATH}"
          if git diff --cached --quiet; then
            echo "Preview already matches the pinned verified build."
            exit 0
          fi
          git commit -m "Deploy verified QCTP device preview ${CANDIDATE_SHA} [skip ci]"
          git push origin HEAD:main
