name: QCTP Windows updater verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/**"
      - ".github/workflows/qctp-windows-updater-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qctp-windows-updater-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows-updater:
    name: Verify updater on Windows PowerShell
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Put checkout on the controlled candidate branch
        shell: powershell
        run: |
          git checkout -B qctp-platform-rev2-codex "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Parse updater with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools\Deploy-QctpAudioPatch.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install active runtime dependencies for the simulation
        shell: cmd
        run: npm ci

      - name: Start a gateway whose static root is outside the repository
        shell: powershell
        run: |
          $runtimeRoot = Join-Path $env:USERPROFILE 'Documents\Codex\QCTP-runtime-sim'
          if (Test-Path $runtimeRoot) { Remove-Item $runtimeRoot -Recurse -Force }
          $dist = Join-Path $runtimeRoot 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          '<!doctype html><title>QCTP old runtime</title><main>old</main>' |
            Set-Content -LiteralPath (Join-Path $dist 'index.html') -Encoding UTF8
          '{"candidate_sha":"old-runtime","audio_fix_present":false}' |
            Set-Content -LiteralPath (Join-Path $dist 'QCTP_PRIVATE_RUNTIME_BUILD.json') -Encoding UTF8

          $env:QCTP_API_TOKEN = '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          $env:QCTP_TRANSCRIPTION_PROVIDER = 'mock'
          $env:PORT = '8787'
          $env:QCTP_MIRROR_JOB_STORE_PATH = Join-Path $runtimeRoot 'mirror-jobs.json'
          $node = (Get-Command node).Source
          $tsx = Join-Path $PWD 'node_modules\tsx\dist\cli.mjs'
          $server = Join-Path $PWD 'server\index.ts'
          $process = Start-Process `
            -FilePath $node `
            -ArgumentList @($tsx, $server) `
            -WorkingDirectory $runtimeRoot `
            -PassThru `
            -WindowStyle Hidden
          $process.Id | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'qctp-gateway.pid')
          $runtimeRoot | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'qctp-runtime-root.txt')

          for ($attempt = 1; $attempt -le 30; $attempt += 1) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8787/health' -TimeoutSec 4
              if ($response.StatusCode -eq 200) { exit 0 }
            }
            catch { }
            Start-Sleep -Seconds 1
          }
          throw 'The simulated QCTP gateway did not become healthy.'

      - name: Prove live-root discovery and deployment while active esbuild is locked
        shell: powershell
        run: |
          $lockPath = Join-Path $PWD 'node_modules\@esbuild\win32-x64\esbuild.exe'
          $stream = [IO.File]::Open($lockPath, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::None)
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Deploy-QctpAudioPatch.ps1 -SkipBrowserTests
            if ($LASTEXITCODE -ne 0) {
              throw "Updater verification failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            $stream.Dispose()
          }

          $expected = (git rev-parse HEAD).Trim()
          $identity = Invoke-RestMethod -Uri ("http://127.0.0.1:8787/QCTP_PRIVATE_RUNTIME_BUILD.json?nonce=" + [Guid]::NewGuid().ToString('N')) -TimeoutSec 8
          if ([string]$identity.candidate_sha -ne [string]$expected) {
            throw "The simulated gateway is not serving the expected candidate. Expected $expected, found $($identity.candidate_sha)."
          }
          if (-not [bool]$identity.audio_fix_present) {
            throw 'The served identity does not attest the Day 1 audio fix.'
          }

      - name: Stop simulated gateway
        if: always()
        shell: powershell
        run: |
          $pidPath = Join-Path $env:RUNNER_TEMP 'qctp-gateway.pid'
          if (Test-Path $pidPath) {
            $gatewayPid = [int](Get-Content -Raw $pidPath)
            Stop-Process -Id $gatewayPid -Force -ErrorAction SilentlyContinue
          }
