name: QCTP Windows updater verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/**"
      - "public/audio/**"
      - "src/audio-player/**"
      - "src/app/screens/PracticeScreen.tsx"
      - "src/app/screens/PracticeScreen.test.tsx"
      - "server/index.ts"
      - "server/index.test.ts"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/qctp-windows-updater-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qctp-windows-updater-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows-updater:
    name: Verify updater on Windows PowerShell
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Put checkout on the controlled candidate branch
        shell: powershell
        run: |
          git checkout -B qctp-platform-rev2-codex "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Parse updater with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools\Deploy-QctpAudioPatch.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install active runtime dependencies for the lock simulation
        shell: cmd
        run: npm ci

      - name: Prove same-origin live-root deployment while active esbuild is locked
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'qctp-runtime-sim'
          if (Test-Path $runtimeRoot) { Remove-Item $runtimeRoot -Recurse -Force }
          $dist = Join-Path $runtimeRoot 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText(
            (Join-Path $dist 'index.html'),
            '<!doctype html><title>QCTP old runtime</title><main>old</main>',
            $utf8NoBom
          )
          [IO.File]::WriteAllText(
            (Join-Path $dist 'QCTP_PRIVATE_RUNTIME_BUILD.json'),
            '{"candidate_sha":"old-runtime","audio_fix_present":false,"local_day1_audio_pack":false}',
            $utf8NoBom
          )

          $serverPath = Join-Path $env:RUNNER_TEMP 'qctp-static-gateway.mjs'
          $serverSource = @'
          import { createReadStream, existsSync, statSync } from "node:fs";
          import { createServer } from "node:http";
          import { extname, join, resolve } from "node:path";

          const root = resolve(process.env.QCTP_TEST_STATIC_ROOT);
          const mime = {
            ".html": "text/html; charset=utf-8",
            ".json": "application/json; charset=utf-8",
            ".js": "text/javascript; charset=utf-8",
            ".css": "text/css; charset=utf-8",
            ".mp3": "audio/mpeg",
            ".png": "image/png",
            ".svg": "image/svg+xml",
            ".webmanifest": "application/manifest+json",
          };
          const server = createServer((request, response) => {
            const url = new URL(request.url ?? "/", "http://127.0.0.1");
            if (url.pathname === "/health") {
              response.writeHead(200, { "content-type": "application/json", "cache-control": "no-store" });
              response.end('{"status":"ok"}');
              return;
            }
            const relative = decodeURIComponent(url.pathname).replace(/^\/+/, "");
            let candidate = resolve(root, relative || "index.html");
            if (!candidate.startsWith(root) || !existsSync(candidate) || !statSync(candidate).isFile()) {
              candidate = join(root, "index.html");
            }
            response.writeHead(200, {
              "content-type": mime[extname(candidate)] ?? "application/octet-stream",
              "cache-control": "no-store",
            });
            createReadStream(candidate).pipe(response);
          });
          server.listen(8787, "127.0.0.1", () => {
            process.stdout.write(`QCTP test gateway serving ${root}\n`);
          });
          '@
          [IO.File]::WriteAllText($serverPath, $serverSource, $utf8NoBom)

          $env:QCTP_TEST_STATIC_ROOT = $dist
          $env:QCTP_LIVE_STATIC_ROOT_HINT = $dist
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'qctp-static-gateway.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'qctp-static-gateway.stderr.log'
          $node = (Get-Command node).Source
          $process = $null
          $stream = $null

          try {
            $process = Start-Process `
              -FilePath $node `
              -ArgumentList @($serverPath) `
              -WorkingDirectory $runtimeRoot `
              -RedirectStandardOutput $stdoutPath `
              -RedirectStandardError $stderrPath `
              -PassThru `
              -WindowStyle Hidden

            $ready = $false
            for ($attempt = 1; $attempt -le 30; $attempt += 1) {
              if ($process.HasExited) {
                throw "The explicit static gateway exited early with code $($process.ExitCode)."
              }
              try {
                $health = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8787/health' -TimeoutSec 4
                $rootResponse = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8787/' -TimeoutSec 4
                if ($health.StatusCode -eq 200 -and $rootResponse.Content -match 'QCTP old runtime') {
                  $probePath = Join-Path $dist 'pre-updater-probe.json'
                  [IO.File]::WriteAllText($probePath, '{"probe":"visible"}', $utf8NoBom)
                  $probe = Invoke-RestMethod -Uri ("http://127.0.0.1:8787/pre-updater-probe.json?nonce=" + [Guid]::NewGuid().ToString('N')) -TimeoutSec 4
                  if ([string]$probe.probe -eq 'visible') {
                    $ready = $true
                    break
                  }
                }
              }
              catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw 'The explicit alternate-root gateway did not become verifiably ready.'
            }
            Write-Host "Explicit alternate-root gateway is ready at $dist"

            $lockPath = Join-Path $PWD 'node_modules\@esbuild\win32-x64\esbuild.exe'
            $stream = [IO.File]::Open(
              $lockPath,
              [IO.FileMode]::Open,
              [IO.FileAccess]::Read,
              [IO.FileShare]::None
            )

            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Deploy-QctpAudioPatch.ps1 -SkipBrowserTests
            if ($LASTEXITCODE -ne 0) {
              throw "Updater verification failed with exit code $LASTEXITCODE"
            }

            $expected = (git rev-parse HEAD).Trim()
            $identity = Invoke-RestMethod -Uri ("http://127.0.0.1:8787/QCTP_PRIVATE_RUNTIME_BUILD.json?nonce=" + [Guid]::NewGuid().ToString('N')) -TimeoutSec 8
            if ([string]$identity.candidate_sha -ne [string]$expected) {
              throw "The simulated gateway is not serving the expected candidate. Expected $expected, found $($identity.candidate_sha)."
            }
            if (-not [bool]$identity.audio_fix_present) {
              throw 'The served identity does not attest the Day 1 audio fix.'
            }
            if (-not [bool]$identity.local_day1_audio_pack) {
              throw 'The served identity does not attest the local Day 1 audio pack.'
            }
            if ([string]$identity.local_day1_audio_schema -ne 'qctp-day1-local-audio-pack-v2') {
              throw "Unexpected served local-audio schema: $($identity.local_day1_audio_schema)"
            }
            if ([int]$identity.local_day1_audio_file_count -ne 23) {
              throw "Unexpected served local-audio file count: $($identity.local_day1_audio_file_count)"
            }
            if ([int64]$identity.local_day1_audio_total_bytes -ne 13340411) {
              throw "Unexpected served local-audio byte count: $($identity.local_day1_audio_total_bytes)"
            }
            if ([bool]$identity.live_third_party_audio_required) {
              throw 'The served identity still requires live third-party audio.'
            }

            $manifestUri = "http://127.0.0.1:8787/audio/day1/manifest.json?nonce=$([Guid]::NewGuid().ToString('N'))"
            $manifest = Invoke-RestMethod -Uri $manifestUri -TimeoutSec 8
            if ([string]$manifest.schema -ne 'qctp-day1-local-audio-pack-v2') {
              throw "Unexpected served manifest schema: $($manifest.schema)"
            }
            if ([int]$manifest.fileCount -ne 23 -or @($manifest.files).Count -ne 23) {
              throw 'The served Day 1 manifest does not contain all 23 audio records.'
            }
            if ([int64]$manifest.totalBytes -ne 13340411 -or [string]$manifest.mediaType -ne 'audio/mpeg') {
              throw 'The served Day 1 manifest has the wrong byte count or media type.'
            }

            foreach ($probeId in @('cue-0000', 'cue-0045')) {
              $record = @($manifest.files | Where-Object { [string]$_.id -eq $probeId } | Select-Object -First 1)
              if ($record.Count -ne 1) {
                throw "The served manifest is missing $probeId."
              }
              $probeFile = Join-Path $env:RUNNER_TEMP ("$probeId-" + [Guid]::NewGuid().ToString('N') + '.mp3')
              try {
                $audioUri = "http://127.0.0.1:8787/audio/day1/$([string]$record[0].relativePath)?nonce=$([Guid]::NewGuid().ToString('N'))"
                $response = Invoke-WebRequest -UseBasicParsing -Uri $audioUri -OutFile $probeFile -PassThru -TimeoutSec 30
                if ([string]$response.Headers['Content-Type'] -notmatch '^audio/mpeg') {
                  throw "$probeId was not served as audio/mpeg."
                }
                if ((Get-Item $probeFile).Length -ne [int64]$record[0].bytes) {
                  throw "$probeId served the wrong number of bytes."
                }
                $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $probeFile).Hash.ToLowerInvariant()
                if ($actualHash -ne ([string]$record[0].sha256).ToLowerInvariant()) {
                  throw "$probeId failed SHA-256 verification."
                }
              }
              finally {
                Remove-Item -LiteralPath $probeFile -Force -ErrorAction SilentlyContinue
              }
            }

            Write-Host 'Full Windows same-origin live-root deployment simulation: PASS'
          }
          finally {
            if ($null -ne $stream) { $stream.Dispose() }
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            Write-Host 'Gateway stdout:'
            if (Test-Path $stdoutPath) { Get-Content $stdoutPath }
            Write-Host 'Gateway stderr:'
            if (Test-Path $stderrPath) { Get-Content $stderrPath }
          }
