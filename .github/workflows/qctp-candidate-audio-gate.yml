name: QCTP candidate audio gate

on:
  push:
    branches:
      - qctp-platform-rev2-codex
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qctp-candidate-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify candidate and package dist
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: qctp-platform-rev2-codex

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Normalize repository formatting
        run: npm run format

      - name: Persist formatting-only normalization when required
        run: |
          if git diff --quiet; then
            echo "Candidate formatting already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Normalize candidate formatting for verification"
          git push origin HEAD:qctp-platform-rev2-codex

      - name: Run formatting, lint, types, coverage, and production build
        run: npm run check

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser acceptance suite
        run: npm run test:e2e

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install local Whisper companion dependencies
        working-directory: local-whisper-companion
        run: uv sync --extra dev

      - name: Run local Whisper tests and quality gates
        working-directory: local-whisper-companion
        run: |
          uv run pytest --cov --cov-report=term-missing
          uv run ruff check .
          uv run basedpyright
          uv run ty check

      - name: Upload verified PWA distribution
        uses: actions/upload-artifact@v4
        with:
          name: qctp-rev2-audio-patch-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
